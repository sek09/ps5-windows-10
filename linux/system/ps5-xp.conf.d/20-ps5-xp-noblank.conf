# XP tile boot only (ps5-session starts X with -configdir ps5-xp.conf.d): never blank or power down the screen.
# Waking from DPMS can drop the PS5 display link (black screen until a fresh modeset), and XP has no idle use for it.
Section "ServerFlags"
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
EndSection
