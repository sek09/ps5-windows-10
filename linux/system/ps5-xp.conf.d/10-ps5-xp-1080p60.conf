# XP tile boot only: ps5-session starts X with -configdir ps5-xp.conf.d, which replaces
# /etc/X11/xorg.conf.d for that session. X starts directly at 1080p 60 Hz, because the
# monitor's preferred 1080p@120 loses the signal on this link. The Plasma desktop still uses
# /etc/X11/xorg.conf.d (1080p, then KScreen 4K: the pink-screen workaround).
Section "Monitor"
    Identifier "DisplayPort-0"
    Modeline "1920x1080_60" 148.50  1920 2008 2052 2200  1080 1084 1089 1125 +hsync +vsync
    Option "PreferredMode" "1920x1080_60"
EndSection
