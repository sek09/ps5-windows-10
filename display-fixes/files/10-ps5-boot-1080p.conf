# X starts at 1080p; KScreen then applies the saved 4K layout. That
# 1080p -> 4K change is what clears the boot-time pink screen (see
# display-fixes/README.md). Delete this file to go back to starting X directly at 4K.
Section "Monitor"
    Identifier "DisplayPort-0"
    Option "PreferredMode" "1920x1080"
EndSection
